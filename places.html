<body class="places-page">
  <noscript>이 페이지는 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript>
  <a class="places-skip" href="#museumList">검색 결과로 바로가기</a>
  <div class="app">
    <header class="app-header">
      <div class="header-copy">
        <p class="eyebrow">아이랑 성장가이드</p>
        <h1>아이랑 나들이</h1>
      </div>
      <a class="icon-btn" href="./index.html#setting" aria-label="설정으로 이동">설정</a>
    </header>

    <main class="places-main">
      <section class="places-intro">
        <p class="eyebrow">전국 박물관 지도</p>
        <h2>아이와 갈 곳을 찾아보세요</h2>
        <p>어린이박물관과 박물관·미술관의 위치와 운영정보를 확인하고 공식 사이트로 이동할 수 있어요.</p>
      </section>

      <section class="places-layout">
        <div class="places-list-panel">
          <div class="places-search">
            <label for="placeKeyword">시설명 또는 지역 검색</label>
            <div class="places-search-row">
              <input id="placeKeyword" type="search" placeholder="예: 어린이박물관, 서울">
              <button id="placeSearchButton" type="button">검색</button>
            </div>
            <div class="places-filters" role="group" aria-label="시설 유형">
              <button class="place-filter is-active" type="button" data-type="all" aria-pressed="true">전체</button>
              <button class="place-filter" type="button" data-type="어린이박물관" aria-pressed="false">어린이박물관</button>
              <button class="place-filter" type="button" data-type="박물관" aria-pressed="false">박물관</button>
              <button class="place-filter" type="button" data-type="미술관" aria-pressed="false">미술관</button>
            </div>
            <div class="places-summary">
              <strong><span id="placeResultCount">0</span>곳</strong>
              <button id="placeCurrentLocation" type="button">내 위치 주변</button>
            </div>
            <p id="placeLocationStatus" class="place-location-status" hidden></p>
          </div>
          <p id="placeDataNotice" class="place-data-notice" hidden></p>
          <ul id="museumList" class="places-list" aria-live="polite"></ul>
        </div>

        <div class="places-map-panel">
          <div id="placeMap" aria-label="전국 박물관 지도"></div>
          <article id="placeDetail" class="place-detail" aria-hidden="true">
            <button id="placeDetailClose" class="place-detail-close" type="button" aria-label="상세정보 닫기">×</button>
            <div id="placeDetailContent"></div>
          </article>
        </div>
      </section>

      <p class="places-source">데이터 출처: <a href="https://www.data.go.kr/data/15017323/standard.do" target="_blank" rel="noopener noreferrer">공공데이터포털 전국박물관미술관정보표준데이터</a> 및 각 시설 공식 홈페이지</p>
